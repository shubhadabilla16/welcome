<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#fed7aa" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Warm background glow -->
  <circle cx="256" cy="200" r="160" fill="url(#glow)"/>

  <!-- Fragrant Incense smoke swirls -->
  <path d="M 230 200 C 210 160, 260 120, 235 70 C 220 40, 260 25, 270 30" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.85" />
  <path d="M 260 190 C 290 150, 240 100, 280 60" fill="none" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <path d="M 290 220 C 330 180, 280 130, 310 90" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" opacity="0.65" />

  <!-- Incense burner / diya base -->
  <ellipse cx="256" cy="380" rx="140" ry="38" fill="#451a03" stroke="#f59e0b" stroke-width="6"/>
  <path d="M 120 380 Q 256 460 392 380 Q 256 430 120 380 Z" fill="#78350f" stroke="#d97706" stroke-width="3"/>

  <!-- Burning Agarbatti sticks with glowing embers -->
  <!-- Stick 1 -->
  <line x1="256" y1="360" x2="215" y2="180" stroke="#fde047" stroke-width="7" stroke-linecap="round"/>
  <circle cx="215" cy="180" r="6" fill="#ef4444"/>
  <circle cx="215" cy="180" r="10" fill="#f97316" opacity="0.5"/>

  <!-- Stick 2 (Center) -->
  <line x1="256" y1="360" x2="256" y2="160" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="160" r="7" fill="#ef4444"/>
  <circle cx="256" cy="160" r="12" fill="#f97316" opacity="0.6"/>

  <!-- Stick 3 -->
  <line x1="256" y1="360" x2="295" y2="185" stroke="#fde047" stroke-width="7" stroke-linecap="round"/>
  <circle cx="295" cy="185" r="6" fill="#ef4444"/>
  <circle cx="295" cy="185" r="10" fill="#f97316" opacity="0.5"/>

  <!-- Emblem text WA / Welcome Agarbatti -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fef3c7" text-anchor="middle" letter-spacing="2">WELCOME AGARBATTI</text>
  <text x="256" y="468" font-family="Arial, sans-serif" font-weight="600" font-size="16" fill="#fed7aa" text-anchor="middle" letter-spacing="4">PURE FRAGRANCE</text>
</svg>
